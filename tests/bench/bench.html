<!doctype html><title>engine bench</title><pre id="log"></pre>
<script type="module">
// Decode benchmark in a real browser tab (Chrome): same checks as tests/test_moe.js / test_mtp.js.
import { Qwen35Engine, prefillMathFeatures } from "../../engine/qwen35.js";
import { makeTokenizer, argmax } from "../../engine/engine.js";
import { parseGGUFHeader, qwen35Weights, tokenizerFromGGUF, streamEntryToGPU } from "../../engine/gguf.js";
const q = new URLSearchParams(location.search), MODEL = q.get("model"), N = +(q.get("tokens") || 40), K = +(q.get("k") || 3), GOLD = JSON.parse(q.get("gold") || "[]");
const MOEK = q.get("moe") ? (q.get("moe").startsWith("{") ? JSON.parse(q.get("moe")) : q.get("moe")) : undefined;   // moeKernel option: preset name or JSON
const log = (s) => { document.getElementById("log").textContent += s + "\n"; console.log(s); };
const readAt = async (off, len) => { const r = await fetch(MODEL, { headers: { Range: `bytes=${off}-${off + len - 1}` } }); return new Uint8Array(await r.arrayBuffer()); };
async function wcacheEntry(device, info) {
  const r = await fetch(`/__wcache?model=${encodeURIComponent(MODEL)}&name=${encodeURIComponent(info.name)}`);
  if (!r.ok) throw new Error(`wcache ${info.name}: HTTP ${r.status} ${await r.text()}`);
  const kind = r.headers.get("X-Kind"), A = +r.headers.get("X-A"), P = +r.headers.get("X-Pad"), B = +r.headers.get("X-B");
  if (r.headers.get("X-Shape") !== JSON.stringify(info.shape)) throw new Error(`wcache ${info.name}: shape ${r.headers.get("X-Shape")} != ${JSON.stringify(info.shape)}`);
  if (kind === "f32" || info.name === "token_embd.weight") {   // small tensors, and the embedding (row lookups on the CPU)
    const buf = await r.arrayBuffer();
    if (kind === "f32") return { kind, data: new Float32Array(buf, 0, A / 4) };
    return { kind, qs: new Uint8Array(buf, 0, A), scales: new Uint32Array(buf, A + P, B / 4), shape: info.shape };
  }
  const usage = GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC;
  device.pushErrorScope("out-of-memory");
  const qs = device.createBuffer({ size: Math.ceil(A / 4) * 4, usage }), sc = device.createBuffer({ size: Math.ceil(B / 4) * 4, usage });
  if (await device.popErrorScope()) throw new Error(`GPU out of memory allocating ${info.name}`);
  const regions = [[0, A, qs], [A + P, B, sc]], STAGE = 8 << 20, stage = new Uint8Array(STAGE);
  let ri = 0, off = 0, st = 0, pos = 0, sinceSync = 0;
  const reader = r.body.getReader();
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    for (let i = 0; i < value.length && ri < regions.length;) {
      const [start, len, gb] = regions[ri];
      if (pos < start) { const k = Math.min(start - pos, value.length - i); i += k; pos += k; continue; }   // alignment pad
      const k = Math.min(len - off - st, STAGE - st, value.length - i);
      stage.set(value.subarray(i, i + k), st); st += k; i += k; pos += k;
      if (st === STAGE || off + st === len) {   // chunks are 4-byte multiples: STAGE, or a region's (4-aligned) tail
        device.queue.writeBuffer(gb, off, stage.buffer, 0, st);
        off += st; sinceSync += st; st = 0;
        if (off === len) { ri++; off = 0; }
      }
    }
    if (sinceSync > 256 << 20) { sinceSync = 0; await device.queue.onSubmittedWorkDone(); }   // bound the GPU process's upload backlog
  }
  if (ri !== regions.length) throw new Error(`wcache ${info.name}: short body`);
  return { kind, shape: info.shape, gpu: { kind, qs, sc } };
}
try {
  // ?prefillmath=f32|f16|sgmatrix (prefill GEMM operand precision, engine/qwen35.js PREFILL_MATH); sgmatrix
  // requests Chrome's subgroup-matrix + shader-f16 features when the adapter has them, else the engine falls back
  const PM = q.get("prefillmath") || undefined, SGM = q.get("sgm") ? JSON.parse(q.get("sgm")) : undefined;
  const ad = await navigator.gpu.requestAdapter(); const device = await ad.requestDevice({ requiredFeatures: prefillMathFeatures(ad, PM),
    requiredLimits: { maxBufferSize: ad.limits.maxBufferSize, maxStorageBufferBindingSize: ad.limits.maxStorageBufferBindingSize, ...(PM || q.has("ubatch") ? { maxComputeWorkgroupStorageSize: ad.limits.maxComputeWorkgroupStorageSize } : {}) } });
  if (PM) log(`adapter features: ${[...ad.features].filter((f) => /f16|subgroup/.test(f)).join(", ") || "(no f16 / subgroup features)"}; subgroupMatrixConfigs ${JSON.stringify([...(ad.info?.subgroupMatrixConfigs || [])].map((c) => [c.componentType, c.resultComponentType, c.M, c.N, c.K]))}; subgroup ${ad.info?.subgroupMinSize}..${ad.info?.subgroupMaxSize}`);
  const G = parseGGUFHeader((await readAt(0, 64 << 20)).buffer); const tok = makeTokenizer(tokenizerFromGGUF(G.meta));
  const arch = G.meta["general.architecture"], L = G.meta[arch + ".block_count"] - (G.meta[arch + ".nextn_predict_layers"] || 0);
  // stream Q4_0/Q8_0 tensors straight into GPU buffers, as the room does (a 21 GB model does not fit in a tab's JS heap)
  G.streamEntry = (info) => streamEntryToGPU(device, info, (i) => fetch(MODEL, { headers: { Range: `bytes=${i.byteOffset}-${i.byteOffset + i.byteLength - 1}` } }));
  // ?wcache=1: take each tensor already converted from serve.mjs's weight cache (the same bytes the
  // repack below would produce) and write it straight into its GPU buffers; loading only, the
  // engine and every kernel are unchanged
  if (q.get("wcache") === "1") G.entryCache = { put() {}, get: (info) => wcacheEntry(device, info) };
  let t0 = performance.now();
  const weights = await qwen35Weights(G, (i) => readAt(i.byteOffset, i.byteLength), { lo: 0, hi: L, hasEmbed: true, hasHead: true, mtp: true });
  // draft-side A/B knobs (speed only, the output must not change): draftvocab=N (0 = full head),
  // dvauto=0 (small head always, no language fallback), mtprefill=0 (one refill submit per row),
  // predraft=0 (no pre-run of the next step's first draft), batchcols=N, draftchain=0, specfuse=0
  // wide prefill (engine option prefillUbatch, off by default): ubatch=256 [tile={"BM":64,...}];
  // prefilllen=N times prefillTokens over N tokens with the wide path off and on (logits compared)
  const opt = (k, d) => (q.has(k) ? +q.get(k) : d);
  const eng = await Qwen35Engine.create({ device, meta: G.meta, weights, layerRange: [0, L], hasEmbed: true, hasHead: true, maxSeq: Math.max(512, (+q.get("prefill") || 0) + 256),
    draftVocab: opt("draftvocab", 0), draftVocabAuto: opt("dvauto", 1) !== 0, ...(q.has("batchcols") ? { batchCols: +q.get("batchcols"), coopRowsB: +q.get("batchcols") >= 16 ? 1 : 4 } : {}),
    draftChain: q.get("draftchain") !== "0", specFuse: q.get("specfuse") !== "0",
    moeFuse: q.get("moefuse") !== "0", moeDnRows: +(q.get("moednrows") || 1),
    // ?moegroup=U: expert-grouped prefill in U-token ubatches (a multiple of batchcols; U <= the prompt length to take effect), ?moegroupuc=8, ?moegrouptiled=0: the exact (slower) grouped kernels
    moeGroupPrefill: opt("moegroup", 0), moeGroupUC: opt("moegroupuc", 8), moeGroupTiled: opt("moegrouptiled", 1) !== 0,
    prefillUbatch: opt("ubatch", 0), ...(q.get("tile") ? { prefillTile: JSON.parse(q.get("tile")) } : {}),   // ?ubatch=256: wide prefill GEMM
    moeKernel: MOEK, prefillMath: PM, prefillSgm: SGM, adapterInfo: ad.info, ...(q.has("attnptile") ? { attnPrefillTile: q.get("attnptile") !== "0" } : {}), ...(q.has("attnptk") ? { attnPrefillTK: +q.get("attnptk") } : {}) });   // ?attnptile=0: attn_flash for prefill instead of the tiled prefill attention (default: on for dense, off for MoE), &attnptk=N its tile; ?moefuse=0: unfused MoE (A/B); ?moe=legacy|default|JSON: unfused expert GEMV layout
  eng.mtpBatchRefill = opt("mtprefill", 1) !== 0; eng.mtpPreDraft = opt("predraft", 1) !== 0;
  if (PM) log(`prefillMath requested ${PM}, running ${eng.prefillMath}${eng.sgmWhy ? " (" + eng.sgmWhy + ")" : ""}${eng.sgmCfg ? ", sgm " + JSON.stringify(eng.sgmCfg) : ""}, GEMM ${eng.gemmOn ? "on" : "off (needs batchcols=16)"}`);
  log(`${arch}: loaded in ${((performance.now() - t0) / 1000).toFixed(0)}s${G.entryCache ? " (pre-converted tensors from serve.mjs)" : ""}, mtp ${!!eng.mtp}, adapter ${ad.info?.vendor}, draftVocab ${eng.draftVocab || "off"}, refill ${eng.mtpBatchRefill ? "batched" : "per-row"}, predraft ${eng.mtpPreDraft}`);
  log(`draftChain ${!!eng.draftChain}, specFuse ${eng.specFuse}, fuseProj ${eng.fuseProj}, moeFuse ${!!eng.moeFuse} R ${eng.moe?.R}, moeKernel ${JSON.stringify(eng.moeK)}, attnPrefillTile ${eng.attnPrefillTile}, moeGroupPrefill ${eng.moeGrpU || "off"}${eng.moeGrpU ? ` UC ${eng.moeGrpUC} tiled ${!!eng.moeGrpTiled}` : ""}${eng.attnPTCfg ? " TK " + eng.attnPTCfg.TK : ""}`);
  // ?prefill=N: prefill tok/s on an N-token prompt (this page's own source, repeated) before the decode checks,
  // with ?prefillmath=... A/B'd against the f32 GEMM in the same tab (engine.prefillMath is a runtime switch).
  // Also reports the next-token logits' relDiff vs the f32 GEMM and whether greedy argmax agrees.
  if (q.has("prefill")) {
    const src = await (await fetch(location.pathname)).text(); let pids = tok.encode(src);
    const NP = +q.get("prefill"); while (pids.length < NP + 1) pids = pids.concat(pids); pids = pids.slice(0, NP + 1);
    const res = {};
    for (const pm of [...new Set(["f32", eng.prefillMath])]) {
      eng.prefillMath = pm;
      if (eng.mtp) eng.mtpFill = true;
      for (let rep = 0; rep < 2; rep++) {   // first run warms pipelines up
        eng.reset(); const t1 = performance.now(); await eng.prefillTokens(pids.slice(0, -1)); const lg = await eng.forwardToken(pids.at(-1));
        res[pm] = { tps: NP / ((performance.now() - t1) / 1000), lg: Float32Array.from(lg) };
      }
      log(`prefill ${NP} tokens, prefillMath ${pm}: ${res[pm].tps.toFixed(1)} tok/s`);
    }
    if (res.f32 && eng.prefillMath !== "f32") {
      const a = res.f32.lg, b = res[eng.prefillMath].lg; let md = 0, sc = 1e-6;
      for (let i = 0; i < a.length; i++) { md = Math.max(md, Math.abs(a[i] - b[i])); sc = Math.max(sc, Math.abs(a[i])); }
      log(`prefill logits ${eng.prefillMath} vs f32: relDiff ${(md / sc).toExponential(2)}, argmax ${argmax(a)} vs ${argmax(b)} ${argmax(a) === argmax(b) ? "same" : "DIFFERENT"}`);
    }
    eng.prefillMath = PM && eng._pmAvail?.[PM] ? PM : "f32";
  }
  const V = tok.vocab, chat = (s) => [V["<|im_start|>"], ...tok.encode("user\n" + s), V["<|im_end|>"], ...tok.encode("\n"), V["<|im_start|>"], ...tok.encode("assistant\n"), V["<think>"], ...tok.encode("\n\n"), V["</think>"], ...tok.encode("\n\n")];
  const out = [];
  if (q.has("prefilllen")) {   // prefill speed, wide path off / on, same tokens (this page's own source, repeated)
    let pids = tok.encode(document.documentElement.outerHTML); while (pids.length < +q.get("prefilllen")) pids = pids.concat(pids);
    pids = pids.slice(0, +q.get("prefilllen"));
    const res = {};
    for (const wide of eng.ubatch ? [false, true] : [false]) {
      eng.reset(); eng.prefillWide = wide; if (eng.mtp) eng.mtpFill = true;
      const t1 = performance.now(); await eng.prefillTokens(pids.slice(0, -1)); const lg = Float32Array.from(await eng.forwardToken(pids.at(-1)));
      res[wide ? "wide" : "default"] = { tokps: +(pids.length / ((performance.now() - t1) / 1000)).toFixed(1), argmax: argmax(lg), lg };
    }
    if (res.wide) { let md = 0, sc = 1e-6; for (let i = 0; i < res.wide.lg.length; i++) { md = Math.max(md, Math.abs(res.wide.lg[i] - res.default.lg[i])); sc = Math.max(sc, Math.abs(res.default.lg[i])); } res.relDiff = +(md / sc).toExponential(2); }
    for (const k of ["default", "wide"]) if (res[k]) delete res[k].lg;
    eng.prefillWide = !!eng.ubatch;
    log("prefill " + JSON.stringify({ tokens: pids.length, ubatch: eng.ubatch, tile: eng.wideCfg, ...res })); out.push({ prefill: res });
  }
  for (const [i, prompt] of ["Write the Python code for two sum. Code only.", "Explain what a hash map is in two sentences."].entries()) {
    const ids = chat(prompt);
    eng.reset(); if (eng.mtp) eng.mtpFill = false; await eng.prefillTokens(ids.slice(0, -1)); let lg = await eng.forwardToken(ids.at(-1));
    let next = argmax(lg); const gen = [next]; t0 = performance.now();
    for (let j = 1; j < N; j++) { lg = await eng.forwardToken(next); next = argmax(lg); gen.push(next); }
    const plain = (N - 1) / ((performance.now() - t0) / 1000), text = tok.decode(gen), g = GOLD[i] || "", n = Math.min(text.length, g.length);
    let spec = null, same = null, acc = "";
    if (eng.mtp) { eng.reset(); eng.mtpFill = true; eng.mtp.stats = { drafts: 0, accepted: 0 }; await eng.prefillTokens(ids.slice(0, -1)); lg = await eng.forwardToken(ids.at(-1));
      next = argmax(lg); const sp = [next]; t0 = performance.now(); while (sp.length < N) { for (const x of await eng.specStep(next, argmax, K)) sp.push(x); next = sp.at(-1); }
      spec = (sp.length - 1) / ((performance.now() - t0) / 1000); same = gen.every((x, j) => sp[j] === x); acc = `${eng.mtp.stats.accepted}/${eng.mtp.stats.drafts}${eng.draftVocab ? ` (small head ${eng._dvSmall ? "on" : "off"})` : ""}`; }
    const r = { prompt, plain: +plain.toFixed(2), spec: spec && +spec.toFixed(2), acceptance: acc, specIdentical: same, golden: g ? (n > 20 && text.slice(0, n) === g.slice(0, n)) : null, text: text.slice(0, 90) };
    out.push(r); log(JSON.stringify(r));
  }
  window.RESULT = out;
} catch (e) { log("ERROR " + (e.stack || e)); window.RESULT = { error: String(e) }; }
</script>
