<!doctype html>
<meta charset="utf-8">
<title>pooled evals</title>
<body style="font: 13px ui-monospace, monospace; margin: 16px">
<pre id="out">loading…</pre>
<script type="module">
// The eval suite's page (tests/eval/run.mjs drives it): ?model=mock|engine. window.__eval:
//   init() -> "ready"             loads the model (engine: /__m.gguf, the file run.mjs serves)
//   task(id) -> { rec, trajectory }
//   selfTest(id) -> { ok, detail }
import { TASKS, byId } from "./tasks/index.js";
import { runTask, selfTest } from "./suite.js";
import { scripted } from "../scripted-model.js";

const q = new URLSearchParams(location.search), kind = q.get("model") || "mock";
const out = document.getElementById("out");
const say = (s) => { out.textContent += "\n" + s; };
let makeModel = null;

async function loadEngine() {
  const { Qwen35Engine } = await import("/engine/qwen35.js");
  const { parseGGUFHeader, qwen35Weights, GGML_EMBED, tokenizerFromGGUF, streamEntryToGPU } = await import("/engine/gguf.js");
  const { makeTokenizer } = await import("/engine/tokenizer.js");
  const { engineModel } = await import("/harness/engine-model.js");
  // read by byte range and stream the quantized tensors straight into GPU buffers (as the room does): the
  // 35B MoE (21 GB) does not fit in a tab's heap as one ArrayBuffer
  const readAt = async (off, len) => new Uint8Array(await (await fetch("/__m.gguf", { headers: { Range: `bytes=${off}-${off + len - 1}` } })).arrayBuffer());
  const G = parseGGUFHeader((await readAt(0, 64 << 20)).buffer);
  const tok = makeTokenizer(tokenizerFromGGUF(G.meta));
  const arch = G.meta["general.architecture"] || "qwen35";   // qwen35, or qwen35moe for the 35B MoE
  const L = G.meta[arch + ".block_count"] - (G.meta[arch + ".nextn_predict_layers"] || 0);
  const adapter = await navigator.gpu.requestAdapter();
  const device = await adapter.requestDevice({ requiredLimits: { maxBufferSize: adapter.limits.maxBufferSize, maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize } });
  let gpuErrors = 0;
  device.addEventListener("uncapturederror", (e) => { if (gpuErrors++ < 3) say("GPU ERROR " + (e.error?.message || "").slice(0, 200)); });
  const maxSeq = +(q.get("ctx") || 16384);
  G.streamEntry = (info) => streamEntryToGPU(device, info, (i) => fetch("/__m.gguf", { headers: { Range: `bytes=${i.byteOffset}-${i.byteOffset + i.byteLength - 1}` } }));
  // ?opts=<JSON>: extra engine options for A/B runs, e.g. {"attnPrefillTile":false,"moeGroupPrefill":0,"prefillUbatch":0}
  const xopts = JSON.parse(q.get("opts") || "{}");
  const eng = await Qwen35Engine.create({ device, meta: G.meta, layerRange: [0, L], hasEmbed: true, hasHead: true, vocab: G.tensors[GGML_EMBED].shape[0], maxSeq, ...xopts,
    weights: await qwen35Weights(G, (i) => readAt(i.byteOffset, i.byteLength), { lo: 0, hi: L, hasEmbed: true, hasHead: true, mtp: !!G.meta[arch + ".nextn_predict_layers"] }) });
  say(`engine: ${L} layers, context ${maxSeq}, attnPrefillTile ${eng.attnPrefillTile}, moeGroupPrefill ${eng.moeGrpU || "off"}, prefillUbatch ${eng.ubatch || "off"}${Object.keys(xopts).length ? ", opts " + JSON.stringify(xopts) : ""}`);
  window.__engineInfo = { attnPrefillTile: eng.attnPrefillTile, moeGroupPrefill: eng.moeGrpU, prefillUbatch: eng.ubatch, get gpuErrors() { return gpuErrors; } };
  return ({ tools }) => {
    const m = engineModel(eng, tok, { tools, maxNew: 4096 });
    let last = { prompt: 0, reused: 0, generated: 0 };
    const generate = async function* (req) {
      const s0 = { ...m.stats };
      yield* m.generate(req);
      last = { prompt: m.stats.prefilled - s0.prefilled + m.stats.reused - s0.reused, reused: m.stats.reused - s0.reused, generated: m.stats.generated - s0.generated };
    };
    return { generate, stats: { get last() { return last; }, get forced() { return m.stats.forced || 0; } }, budget: maxSeq - 4200, count: (t) => tok.encode(t).length };
  };
}

window.__eval = {
  tasks: TASKS.map((t) => t.id),
  async init() {
    makeModel = kind === "engine" ? await loadEngine() : ({ task }) => ({ generate: scripted(task.mock) });
    say(`model: ${kind}`);
    return "ready";
  },
  async task(id) {
    const res = await runTask(byId(id), { makeModel, model: kind });
    say(`${res.rec.ok ? "PASS" : "FAIL"} ${id}`);
    return res;
  },
  selfTest: (id) => selfTest(byId(id)),
};
out.textContent = "ready";
</script>
